<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mem</title>
<style>
  :root { color-scheme: dark; --bg:#111318; --panel:#181b22; --line:#2a2f3a; --fg:#d7dae0; --dim:#8a9099;
          --fast:#f0a35a; --slow:#6ea8fe; --stable:#63c28a; --due:#ff6b6b; --card:#555b66; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; grid-template-columns: 300px 1fr 460px; font: 13px/1.4 ui-monospace, Menlo, monospace; background:var(--bg); color:var(--fg); }
  aside, main, section { height:100vh; overflow:hidden; }
  aside { border-right:1px solid var(--line); display:flex; flex-direction:column; }
  section { border-left:1px solid var(--line); display:flex; flex-direction:column; }
  header { padding:10px 12px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  input[type=search] { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:6px 8px; border-radius:4px; font:inherit; }
  #list { overflow:auto; flex:1; }
  .row { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover, .row.sel { background:var(--panel); }
  .row .t { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .m { color:var(--dim); font-size:11px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .fast{background:var(--fast)} .slow{background:var(--slow)} .stable{background:var(--stable)}
  .due { color:var(--due); }
  main { position:relative; }
  svg { width:100%; height:100%; display:block; }
  #legend { position:absolute; left:12px; bottom:10px; color:var(--dim); font-size:11px; }
  #legend label { margin-left:12px; cursor:pointer; }
  .tip { position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--line); padding:4px 8px; border-radius:4px; font-size:12px; max-width:360px; display:none; }
  #detail { display:flex; flex-direction:column; height:100%; }
  #meta { padding:10px 12px; border-bottom:1px solid var(--line); color:var(--dim); font-size:12px; }
  #meta b { color:var(--fg); font-weight:600; }
  textarea { flex:1; width:100%; resize:none; border:0; outline:0; padding:12px; background:var(--bg); color:var(--fg); font:inherit; }
  #bar { padding:8px 12px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  button { background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:6px 12px; border-radius:4px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--fg); }
  #status { color:var(--dim); flex:1; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #events { max-height:140px; overflow:auto; border-top:1px solid var(--line); padding:6px 12px; color:var(--dim); font-size:11px; }
  #events div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #modes button { padding:3px 9px; font-size:11px; }
  #modes button.on { border-color:var(--fg); background:#242935; }
  #view { flex:1; overflow:auto; padding:14px 16px; font: 13.5px/1.55 ui-sans-serif, system-ui, sans-serif; display:none; }
  #view h1,#view h2,#view h3 { font-size:1.05em; margin:1.1em 0 .4em; }
  #view p { margin:.55em 0; }
  #view code { font: 12px ui-monospace, Menlo, monospace; background:#20242d; padding:1px 4px; border-radius:3px; }
  #view pre { background:#20242d; padding:8px 10px; border-radius:4px; overflow:auto; }
  #view a { color:var(--slow); }
  .fm { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:12px; color:var(--dim); }
  .fm h2 { margin:0 0 4px; font-size:14px; color:var(--fg); }
  .fm .tag { display:inline-block; background:#242935; border-radius:10px; padding:0 7px; margin:2px 4px 0 0; font-size:11px; }
  .fm .cite { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .claim { border-bottom:1px dotted #4a5262; }
  .claim.v  { border-bottom-color:var(--stable); }
  .claim.due{ border-bottom-color:var(--fast); }
  .claim.u  { border-bottom-color:var(--due); }
  .chip { display:inline-block; font: 10.5px ui-monospace, Menlo, monospace; border-radius:9px; padding:0 6px; margin-left:4px; vertical-align:baseline; cursor:pointer; white-space:nowrap; border:1px solid transparent; }
  .chip.v  { background:#173323; color:var(--stable); border-color:#245a3a; }
  .chip.due{ background:#3a2a12; color:var(--fast);   border-color:#6b4a1c; }
  .chip.u  { background:#3a1a1c; color:var(--due);    border-color:#6b2c30; }
  .chip.asof { background:#232833; color:var(--dim); border-color:#3a4150; cursor:default; }
  .chip.todo { background:#2a2338; color:#c6a7ff;     border-color:#4c3d6e; cursor:default; }
  #menu { position:absolute; display:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; z-index:5; font-size:12px; min-width:220px; box-shadow:0 6px 24px #0008; }
  #menu .h { color:var(--dim); margin-bottom:6px; }
  #menu button { display:block; width:100%; text-align:left; margin-top:4px; }
</style>
</head>
<body>
<aside>
  <header><input id="q" type="search" placeholder="search (semantic) or filter…" autocomplete="off"><span id="count" style="color:var(--dim)"></span></header>
  <div id="list"></div>
</aside>
<main>
  <svg></svg>
  <div class="tip" id="tip"></div>
  <div id="legend">
    <span class="dot fast"></span>fast <span class="dot slow"></span>slow <span class="dot stable"></span>stable
    <span style="color:var(--due)">◯ due</span> · size = heat (30d)
    <label><input type="checkbox" id="cards"> show skill cards</label>
  </div>
</main>
<section id="detail">
  <div id="meta">select a page</div>
  <div id="view"></div>
  <textarea id="text" spellcheck="false"></textarea>
  <div id="events"></div>
  <div id="bar">
    <span id="modes"><button id="mRead" class="on">read</button><button id="mEdit">edit</button></span>
    <span id="status">browsing logs no usage events; verdicts and saves do</span>
    <button id="save" disabled>save</button>
  </div>
</section>
<div id="menu"></div>
<script src="/vendor/d3-7.9.0.min.js"></script>
<script src="/vendor/marked-12.0.2.min.js"></script>
<script src="/vendor/purify-3.4.17.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
