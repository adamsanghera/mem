[project]
name = "mem"
version = "0.1.0"
description = "Personal agent memory: memoryfield-spec corpus with a hit ledger"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "sqlite-vec>=0.1.6"]

[project.scripts]
mem = "mem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem"]

[dependency-groups]
dev = ["pytest>=8"]
